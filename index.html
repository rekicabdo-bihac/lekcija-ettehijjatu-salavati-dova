<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Et-Tehijjatu • Salavati • Dove</title><style>*{box-sizing:border-box}body{margin:0;background:#09231e;color:#fff;font:16px Arial}header{text-align:center;background:#12664b;padding:16px}h1{margin:0;color:#ffe3a0}main{max-width:720px;margin:auto;padding:12px}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}button{background:#205a47;color:white;border:1px solid #d5b65e;border-radius:11px;padding:12px;font-weight:bold;font-size:14px;cursor:pointer}button.on{background:#e0b95a;color:#18251d}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}.box{background:#143a31;border:1px solid #b69b57;border-radius:15px;padding:15px;margin:12px 0}.answer{display:block;width:100%;text-align:left;margin:8px 0}.verse{font-size:20px;color:#ffdfa0;line-height:1.6;white-space:pre-wrap}h2{color:#ffdfa0}.progress{background:#36574d;border-radius:12px;height:8px;margin:12px 0;overflow:hidden}#bar{height:100%;background:#edc66b;width:0}#msg{text-align:center;min-height:25px;font-weight:bold}#score{text-align:center;color:#ffdfa0;margin:9px}.match{display:grid;grid-template-columns:1fr 1fr;gap:6px}.match button{width:100%;margin:4px 0;font-size:12px;min-height:65px}.chosen{background:#bc922e}.done{opacity:.4}footer{text-align:center;padding:18px;color:#ffdfa0}@media(max-width:400px){button{font-size:12px}.verse{font-size:17px}}</style></head><body><header><h1>🕌 AKADEMIJA NAMAZA</h1>Et-Tehijjatu • Salavati • Dove</header><main><div id="subjects" class="subjects"></div><nav id="nav"></nav><div id="score">Bodovi: 0</div><div class="progress"><div id="bar"></div></div><div id="content" class="box"></div><div id="msg"></div></main><footer>Pripremio Abdo ef. Rekić</footer><script>
const D=[{name:'ET-TEHIJJATU',intro:'Et-Tehijjatu učimo na svakom sjedenju u namazu.',parts:[['ET-TEHIJJATU LILLAHI VES-SALEVATU VET-TAJJIBATU','Pozdravi, blagoslovi i lijepe riječi pripadaju Allahu.'],['ES-SELAMU ALEJKE EJJUHEN-NEBIJJU VE RAHMETULLAHI VE BEREKATUHU','Neka je selam, Allahova milost i Njegov blagoslov na tebe, Vjerovjesniče!'],['ES-SELAMU ALEJNA VE ALA IBADILLAHIS-SALIHIN','Neka je selam na nas i na sve dobre Allahove robove!'],['EŠHEDU EN LA ILAHE ILLALLAH','Svjedočim da nema Boga osim Allaha.'],['VE EŠHEDU ENNE MUHAMMEDEN ABDUHU VE RESULUHU','I svjedočim da je Muhammed Allahov rob i Allahov poslanik.']]},{name:'SALAVATI',intro:'Salavate učimo na posljednjem sjedenju poslije Et-Tehijjatu.',parts:[['ALLAHUMME SALLI ALA MUHAMMEDIN VE ALA ALI MUHAMMED','Allahu, blagoslovi Muhammeda i njegovu porodicu.'],['KEMA SALLEJTE ALA IBRAHIME VE ALA ALI IBRAHIM','Kao što si blagoslovio Ibrahima i njegovu porodicu.'],['INNEKE HAMIDUN MEDŽID','Zaista si Ti hvaljen i slavljen.'],['ALLAHUMME BARIK ALA MUHAMMEDIN VE ALA ALI MUHAMMED','Allahu, obdari Muhammeda i njegovu porodicu blagoslovom.'],['KEMA BAREKTE ALA IBRAHIME VE ALA ALI IBRAHIM','Kao što si obdario Ibrahima i njegovu porodicu blagoslovom.'],['INNEKE HAMIDUN MEDŽID','Zaista si Ti hvaljen i slavljen.']]},{name:'DOVE',intro:'Dove su naše molbe Allahu; učimo ih poslije salavata na posljednjem sjedenju.',parts:[['RABBENA ATINA FID-DUNJA HASENETEN','Gospodaru naš, daj nam dobro na ovom svijetu.'],['VE FIL-AHIRETI HASENETEN','I na onom svijetu.'],['VE KINA AZABEN-NAR','I sačuvaj nas patnje u Džehennemu.'],['RABBENA-GFIR LI','Gospodaru naš, oprosti meni.'],['VE LI-VALIDEJJE','I mojim roditeljima.'],['VE LIL-MU’MININE JEVME JEKUMUL-HISAB','I svim vjernicima na Sudnjem danu.']]}];
const N=['NAUČI','SPOJI','SLOŽI REDOM','ŠTA NEDOSTAJE?','PREPOZNAJ PO ZNAČENJU','BRZI IZAZOV','ZAVRŠNI ISPIT'];let sub=0,stage=0,idx=0,score=0,sel=null,matched=new Set(),order=[],bank=[],locked=false,timeout=null;const $=s=>document.getElementById(s),mix=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b},esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function beep(ok){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?760:210;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.start();o.stop(a.currentTime+.23);o.onended=()=>a.close()}catch(e){}}function mark(ok){score+=ok?10:-3;$('score').textContent='Bodovi: '+score;$('msg').textContent=ok?'✓ Tačno! +10':'✕ Netačno! −3';$('msg').style.color=ok?'#8ff3ac':'#ff9a9a';beep(ok)}function progress(a,b){$('bar').style.width=100*a/b+'%'}function menus(){$('subjects').innerHTML=D.map((x,i)=>`<button class="${i===sub?'on':''}" onclick="choose(${i})">${x.name}</button>`).join('');$('nav').innerHTML=N.map((x,i)=>`<button class="${i===stage?'on':''}" onclick="go(${i})">${i+1}. ${x}</button>`).join('')}function choose(i){sub=i;score=0;$('score').textContent='Bodovi: 0';go(0)}function go(i){clearTimeout(timeout);stage=i;idx=0;sel=null;matched=new Set();locked=false;$('msg').textContent='';menus();if(i===0)learn();else if(i===1)match();else if(i===2){order=mix(D[sub].parts.map((p,i)=>i));drawOrder()}else{bank=makeBank();if(i===3)bank=bank.filter(q=>q.type==='missing');if(i===4)bank=bank.filter(q=>q.type==='meaning');if(i===5)bank=mix(bank).slice(0,15);if(i===6){let pool=mix(bank);bank=Array.from({length:50},(_,j)=>({...pool[j%pool.length],opts:mix(pool[j%pool.length].opts)}))}drawQuiz()}}function learn(){let d=D[sub];progress(idx+1,d.parts.length+1);$('content').innerHTML=`<h2>📖 NAUČI — ${d.name}</h2><p>${idx+1}/${d.parts.length+1}</p><div class="box">${idx===0?esc(d.intro):`<div class="verse">${esc(d.parts[idx-1][0])}</div><p>${esc(d.parts[idx-1][1])}</p>`}</div><button onclick="idx=Math.max(0,idx-1);learn()">← Nazad</button> <button onclick="idx<${d.parts.length}? (idx++,learn()):go(1)">Dalje →</button>`}function match(){let d=D[sub],ids=d.parts.map((_,i)=>i);if(!order.length||stage!==1)order=mix(ids);progress(matched.size,ids.length);$('content').innerHTML=`<h2>🧩 SPOJI</h2><p>Odaberi tekst lijevo, pa odgovarajući prijevod desno.</p><div class="match"><div>${order.map(i=>`<button ${matched.has(i)?'disabled':''} class="${sel===i?'chosen':''} ${matched.has(i)?'done':''}" onclick="sel=${i};match()">${esc(d.parts[i][0])}</button>`).join('')}</div><div>${mix(ids).map(i=>`<button ${matched.has(i)?'disabled':''} class="${matched.has(i)?'done':''}" onclick="pair(${i})">${esc(d.parts[i][1])}</button>`).join('')}</div></div>${matched.size===ids.length?'<button onclick="go(2)">Sljedeća etapa →</button>':''}`}function pair(i){if(sel===null)return;let ok=sel===i;if(ok)matched.add(i);mark(ok);sel=null;match()}function drawOrder(){let d=D[sub];progress(idx,d.parts.length);$('content').innerHTML=`<h2>🔢 SLOŽI REDOM</h2><p>Odaberi sljedeći dio učenja.</p><div class="box">${d.parts.slice(0,idx).map(p=>'<p>✓ '+esc(p[0])+'</p>').join('')}</div>${order.map(i=>`<button class="answer" onclick="pick(${i})">${esc(d.parts[i][0])}</button>`).join('')}${idx===d.parts.length?'<button onclick="go(3)">Sljedeća etapa →</button>':''}`}function pick(i){let ok=i===idx;mark(ok);if(ok){idx++;order=order.filter(x=>x!==i)}drawOrder()}function makeBank(){let p=D[sub].parts,all=[];function add(q,a,others,type){let opts=[...new Set([a,...others.filter(x=>x!==a)])];if(opts.length>=2)all.push({q,a,opts:mix(opts.slice(0,4)),type})}p.forEach(([text,meaning],i)=>{add('Šta znači: '+text+'?',meaning,mix(p.map(x=>x[1]).filter(x=>x!==meaning)),'meaning');add('Koji tekst odgovara prijevodu: '+meaning+'?',text,mix(p.map(x=>x[0]).filter(x=>x!==text)),'meaning');if(i<p.length-1)add('Šta dolazi poslije: '+text+'?',p[i+1][0],mix(p.map(x=>x[0]).filter(x=>x!==p[i+1][0])),'order');let w=text.split(' '),k=Math.floor(w.length/2);add('Dopuni: '+w.map((x,j)=>j===k?'______':x).join(' '),w[k],mix(p.flatMap(x=>x[0].split(' ')).filter(x=>x!==w[k])),'missing')});return mix(all)}function drawQuiz(){if(idx>=bank.length){progress(1,1);$('content').innerHTML=`<h2>🏆 Bravo!</h2><p>Završena etapa: ${N[stage]}</p><p>Ukupno bodova: ${score}</p><button onclick="go(${stage===6?0:stage+1})">${stage===6?'Ponovi lekciju':'Sljedeća etapa'} →</button>`;return}let t=bank[idx];progress(idx,bank.length);$('content').innerHTML=`<h2>${N[stage]}</h2><p>Zadatak ${idx+1}/${bank.length}</p><div class="box"><b>${esc(t.q)}</b></div>${t.opts.map((o,i)=>`<button class="answer" id="opt${i}" onclick="answer(${i})">${esc(o)}</button>`).join('')}`}function answer(i){if(locked)return;locked=true;let t=bank[idx],ok=t.opts[i]===t.a;mark(ok);t.opts.forEach((o,j)=>{let b=$('opt'+j);b.disabled=true;if(o===t.a)b.style.background='#168544';else if(j===i)b.style.background='#a72c38'});timeout=setTimeout(()=>{idx++;locked=false;$('msg').textContent='';drawQuiz()},850)}choose(0);
</script></body></html>
